name: Build DJ JAY E CHRONIX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Clean App & Compile APK
        run: |
          flutter create /tmp/dj_app --platforms=android --project-name dj_jay_e_chronix --org com.djjayechronix
          cd /tmp/dj_app
          flutter pub add url_launcher
          cat << 'EOF' > lib/main.dart
