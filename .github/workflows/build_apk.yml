name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create /tmp/app --platforms=android
          cp lib/main.dart /tmp/app/lib/main.dart
          cd /tmp/app && flutter pub add url_launcher && flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dj-chronix-apk
          path: app-debug.apk
