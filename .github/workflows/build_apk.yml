name: Build DJ JAY E CHRONIX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Flutter Project & Android SDK
        run: |
          rm -f pubspec.yaml
          flutter create . --platforms=android --project-name dj_jay_e_chronix --org com.djjayechronix
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          flutter pub add url_launcher audioplayers video_player file_picker shared_preferences
      - name: Build Release APK
        run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: dj-chronix-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
