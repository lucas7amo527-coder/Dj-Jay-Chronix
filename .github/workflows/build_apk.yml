name: Build DJ JAY E CHRONIX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Clean APK
        run: |
          rm -f pubspec.yaml
          flutter create . --platforms=android --project-name dj_jay_e_chronix --org com.djjayechronix
          flutter pub add url_launcher
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: dj-chronix-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
